<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111110">

  <title>Cadastro | Akemi Studio</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #111110;
      --panel: #191917;
      --panel-hover: #211f1b;
      --text: #eee9df;
      --muted: #aaa49a;
      --red: #8f3935;
      --red-light: #bc6258;
      --border: rgba(238, 233, 223, .13);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
      overflow-x: hidden;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      background:
        radial-gradient(
          ellipse at 85% 15%,
          rgba(143, 57, 53, .13),
          transparent 32rem
        ),
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .035;
      background-image:
        linear-gradient(135deg, #eee9df 1px, transparent 1px),
        linear-gradient(45deg, #eee9df 1px, transparent 1px);
      background-size: 44px 44px;
    }

    a {
      color: var(--red-light);
      text-decoration: none;
      transition: color .25s ease;
    }

    a:hover {
      color: #e5a098;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      animation: appear .7s ease both;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: .85rem;
    }

    .back-link:hover {
      color: var(--text);
    }

    .login-panel {
      position: relative;
      padding: clamp(28px, 6vw, 44px);
      overflow: hidden;
      background: rgba(25, 25, 23, .94);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .25);
    }

    .login-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--red),
        var(--red-light),
        transparent
      );
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 40px;
      color: var(--text);
      font-size: .95rem;
      font-weight: 600;
      letter-spacing: .14em;
    }

    .brand:hover {
      color: var(--text);
    }

    .brand-symbol {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--text);
      background: var(--red);
      border: 1px solid rgba(238, 233, 223, .2);
      border-radius: 2px;
      font-family: serif;
      font-size: 1.4rem;
      font-weight: 400;
      transition: transform .3s ease, background .3s ease;
    }

    .brand:hover .brand-symbol {
      transform: rotate(-5deg);
      background: var(--red-light);
    }

    .brand-studio {
      color: var(--red-light);
      font-weight: 400;
      letter-spacing: .18em;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
      color: var(--red-light);
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--red-light);
    }

    h1 {
      margin: 0 0 12px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 8vw, 3.2rem);
      font-weight: 600;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin-bottom: 30px;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.7;
    }

    .form-label {
      margin-bottom: 8px;
      color: #d9d2c7;
      font-size: .82rem;
      font-weight: 500;
    }

    .form-control {
      min-height: 51px;
      padding: 13px 15px;
      color: var(--text);
      background: #111110;
      border: 1px solid var(--border);
      border-radius: 3px;
      font-family: inherit;
      font-size: .9rem;
      transition: border-color .25s ease, box-shadow .25s ease,
                  background .25s ease;
    }

    .form-control::placeholder {
      color: #77736b;
    }

    .form-control:hover {
      border-color: rgba(238, 233, 223, .25);
    }

    .form-control:focus {
      color: var(--text);
      background: #151513;
      border-color: var(--red-light);
      box-shadow: 0 0 0 3px rgba(188, 98, 88, .12);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap .form-control {
      padding-right: 78px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      padding: 5px;
      color: var(--muted);
      background: transparent;
      border: 0;
      font-family: inherit;
      font-size: .75rem;
      cursor: pointer;
    }

    .toggle-password:hover {
      color: var(--text);
    }

    .btn-login {
      min-height: 51px;
      margin-top: 10px;
      color: white;
      background: var(--red);
      border: 1px solid var(--red);
      border-radius: 3px;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      transition: background .25s ease, transform .25s ease,
                  border-color .25s ease;
    }

    .btn-login:hover {
      color: white;
      background: var(--red-light);
      border-color: var(--red-light);
      transform: translateY(-2px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:focus-visible,
    .toggle-password:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--red-light);
      outline-offset: 4px;
    }

    .register-text {
      margin: 25px 0 0;
      color: var(--muted);
      font-size: .85rem;
      text-align: center;
    }

    .register-text a {
      font-weight: 600;
    }

    .footer-note {
      margin-top: 22px;
      color: #706d65;
      font-size: .72rem;
      letter-spacing: .04em;
      text-align: center;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="login-wrapper">

    <a href="index.html" class="back-link">
      <span aria-hidden="true">←</span> Voltar ao início
    </a>

    <section class="login-panel">

      <a href="index.html" class="brand">
        <span class="brand-symbol">朱</span>
        <span>AKEMI <span class="brand-studio">STUDIO.</span></span>
      </a>

      <div class="eyebrow">Comece agora</div>

      <h1>Criar<br>conta.</h1>

      <p class="subtitle">
        Cadastre-se para organizar clientes, tatuadores
        e agendamentos do seu estúdio.
      </p>

      <form id="form-cadastro">

        <div class="mb-4">
          <label for="nome" class="form-label">Nome</label>
          <input
            type="text"
            id="nome"
            name="nome"
            class="form-control"
            placeholder="Seu nome"
            autocomplete="name"
            required
          >
        </div>

        <div class="mb-4">
          <label for="email" class="form-label">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="voce@exemplo.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="mb-4">
          <label for="senha" class="form-label">Senha</label>

          <div class="password-wrap">
            <input
              type="password"
              id="senha"
              name="senha"
              class="form-control"
              placeholder="Crie uma senha"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="toggleSenha"
              aria-controls="senha"
              aria-pressed="false"
            >
              Mostrar
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-login w-100">
          Criar minha conta <span aria-hidden="true">↗</span>
        </button>

      </form>

      <p class="register-text">
        Já tem conta?
        <a href="login.html">Entrar</a>
      </p>

    </section>

    <p class="footer-note">
      AKEMI STUDIO · ARTE, IDENTIDADE E PRECISÃO
    </p>

  </main>

  <script>
    // dentro de uma função para não conflitar com variáveis do cadastro.js
    (() => {
      const botao = document.getElementById("toggleSenha");
      const campo = document.getElementById("senha");

      botao.addEventListener("click", () => {
        const mostrando = campo.type === "password";

        campo.type = mostrando ? "text" : "password";
        botao.textContent = mostrando ? "Ocultar" : "Mostrar";
        botao.setAttribute("aria-pressed", String(mostrando));
      });
    })();
  </script>

  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>

</body>
</html>
